<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自媒体工作台 · 内容生产 v2</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%2322d3ee'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23050a18'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   自媒体工作台 v2 · Design Token 注册处（唯一允许颜色/字号/间距字面量的位置）
   规则（AGENTS.md / Constitution II）：token 定义处之外禁止硬编码
============================================================ */
:root{
  /* ---- 表面与文字 ---- */
  --bg:#050a18;
  --panel:rgba(14,24,42,.72);
  --panel-2:rgba(20,32,56,.85);
  --panel-glass:rgba(8,14,28,.92);
  --panel-deep:rgba(5,10,24,.7);
  --ink:#e6f2ff; --muted:#8ba3c7; --soft:#54688a; --bright:#ffffff;
  --line:rgba(139,163,199,.14); --line-2:rgba(139,163,199,.28);
  --dim-wash:rgba(230,237,247,.025);
  --hover-wash:rgba(34,211,238,.04);
  --accent-wash:rgba(34,211,238,.08);
  --accent-wash-2:rgba(34,211,238,.12);
  --on-accent:#04101f;

  /* ---- 语义色 ---- */
  --cy:#22d3ee; --pu:#a78bfa; --ok:#34d399; --warn:#fbbf24; --bad:#f87171; --link:#5b9dff;

  /* ---- 状态色（PRD §4 状态机）---- */
  --st-wait:#94a3bd; --st-accepted:#5b9dff; --st-script:#fbbf24;
  --st-approval:#c084fc; --st-making:#fb923c; --st-published:#34d399; --st-shelved:#64708a;

  /* ---- 账号色 ---- */
  --ac-gs:#22d3ee; --ac-rzdy:#5b9dff; --ac-rzxhs:#c084fc;

  /* ---- 渐变 / 光晕 / 阴影（均登记为 token）---- */
  --grad-orb:radial-gradient(circle at 35% 35%,#7ff3ff,#22d3ee 45%,#0b3a4a);
  --grad-accent:linear-gradient(135deg,#22d3ee,#5b9dff);
  --grad-track:linear-gradient(90deg,rgba(34,211,238,.15),rgba(34,211,238,.7),rgba(167,139,250,.7),rgba(52,211,153,.6));
  --glow-bg:radial-gradient(1000px 500px at 50% -20%,rgba(34,211,238,.10),transparent 60%),
           radial-gradient(800px 500px at 95% 120%,rgba(167,139,250,.08),transparent 60%);
  --glow-orb:0 0 14px rgba(34,211,238,.5);
  --glow-orb-hi:0 0 26px rgba(34,211,238,.9);
  --glow-track:0 0 18px rgba(34,211,238,.35);
  --glow-node:0 0 14px var(--sc,var(--cy));
  --glow-cur:0 0 10px rgba(34,211,238,.6);
  --glow-nav:0 0 14px rgba(34,211,238,.25);
  --glow-btn:0 0 16px rgba(34,211,238,.4);
  --glow-chip:0 0 12px color-mix(in srgb,var(--fc,var(--cy)) 28%,transparent);
  --glow-pod:0 6px 22px color-mix(in srgb,var(--sc,var(--cy)) 28%,transparent);
  --glow-flash:0 0 26px rgba(251,191,36,.8);
  --shadow-toast:0 8px 30px rgba(0,0,0,.5);
  --shadow-modal:0 18px 60px rgba(0,0,0,.55);
  --shadow-island:0 18px 50px rgba(0,0,0,.5), 0 0 0 1px rgba(139,163,199,.05);
  --shadow-pop:0 4px 20px rgba(34,211,238,.12);
  --inset-cal:inset 0 0 14px rgba(34,211,238,.1);

  /* ---- 描边 / 薄涂（半透明变体，登记后经 var 引用）---- */
  --cy-line:rgba(34,211,238,.3); --cy-line-2:rgba(34,211,238,.45); --cy-line-soft:rgba(34,211,238,.25);
  --ok-line:rgba(52,211,153,.4); --bad-line:rgba(248,113,113,.4); --bad-wash:rgba(248,113,113,.08);
  --warn-line:rgba(251,191,36,.3); --warn-line-2:rgba(251,191,36,.45); --warn-wash:rgba(251,191,36,.1);
  --link-line:rgba(91,157,255,.4);

  /* ---- 字号阶 ---- */
  --font-base:-apple-system,"PingFang SC","Segoe UI",Roboto,sans-serif;
  --font-brand:Orbitron,var(--font-base);
  --font-mono:Orbitron,monospace;
  --fs-2xs:9px; --fs-xs:11px; --fs-sm:12.5px; --fs-md:13px; --fs-lg:14px;
  --fs-xl:16px; --fs-h2:17px; --fs-2xl:19px; --fs-num:29px;

  /* ---- 间距阶（2/4/8/12/16/20/24/28/32/40）---- */
  --sp-1:2px; --sp-2:4px; --sp-3:8px; --sp-4:12px; --sp-5:16px;
  --sp-6:20px; --sp-7:24px; --sp-8:28px; --sp-9:32px; --sp-10:40px;

  /* ---- 圆角 ---- */
  --r-sm:6px; --r-md:10px; --r-lg:14px; --r-pill:99px; --r-xl:24px;

  /* ---- 星轨布局定位（结构性位置 token）---- */
  --track-top:44px; --shuttle-top:39px; --node-top:34px;
  --cnt-top:64px; --numtag-top:-14px;
  --drawer-w:212px; --drawer-off:12px; --mtabs-h:76px;
  --station-w:120px; --station-w-m:56px; --node-top-m:25px;
  --mask-bg:rgba(3,6,14,.6);
  --pods-gap:13px;
}
/* ============ token 注册结束，以下全部只引用 var() ============ */
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-base);background:var(--bg);color:var(--ink);
  min-height:100vh;overflow-x:hidden;line-height:1.6}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:var(--glow-bg)}
#stars{position:fixed;inset:0;z-index:0}
::-webkit-scrollbar{width:var(--sp-3);height:var(--sp-3)}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:var(--r-sm)}
::-webkit-scrollbar-track{background:transparent}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:var(--fs-sm);color:var(--ink);
  background:var(--panel-deep);border:1px solid var(--line-2);border-radius:var(--r-sm);
  padding:var(--sp-3) var(--sp-3);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--cy)}
select option{background:var(--panel-2)}
a{color:var(--link)}
.app{position:relative;z-index:2;max-width:1440px;margin:0 auto;padding:0 var(--sp-8) var(--sp-10)}

/* ===== 顶栏 ===== */
header{display:flex;align-items:center;gap:var(--sp-4);padding:var(--sp-6) 0 0;flex-wrap:wrap}
.logo{font-family:var(--font-brand);font-size:var(--fs-2xl);letter-spacing:.08em;
  display:flex;align-items:center;gap:var(--sp-3);white-space:nowrap}
.logo .orb{width:30px;height:30px;border-radius:50%;background:var(--grad-orb);
  box-shadow:var(--glow-orb);animation:orb 4s ease-in-out infinite}
@keyframes orb{0%,100%{box-shadow:var(--glow-orb)}50%{box-shadow:var(--glow-orb-hi)}}
.logo em{font-style:normal;color:var(--cy);text-shadow:0 0 14px var(--cy-line-2)}
.acct{font-size:var(--fs-xs);color:var(--muted);border:1px solid var(--line-2);
  border-radius:var(--r-pill);padding:var(--sp-2) var(--sp-3);white-space:nowrap}
/* ===== 悬停导航浮岛（桌面）+ 底部 Tab（移动）===== */
#edgezone{position:fixed;left:0;top:0;bottom:0;width:16px;z-index:45}
#drawer-nav{position:fixed;left:var(--drawer-off);top:50%;bottom:auto;width:var(--drawer-w);z-index:46;
  border-radius:var(--r-xl);border:1px solid var(--cy-line-soft);
  background:var(--panel-glass);backdrop-filter:blur(22px);
  box-shadow:var(--shadow-island);
  transform:translateY(-50%) translateX(calc(-100% - 24px));opacity:0;pointer-events:none;
  transition:transform .3s cubic-bezier(.2,.9,.3,1),opacity .22s ease;
  display:flex;flex-direction:column;gap:var(--sp-1);padding:var(--sp-3)}
body.nav-open #drawer-nav,body.nav-pin #drawer-nav{transform:translateY(-50%);opacity:1;pointer-events:auto}
body.nav-pin .app{padding-left:calc(var(--drawer-w) + var(--drawer-off) + var(--sp-6))}
.dn-cap{width:34px;height:4px;border-radius:var(--r-pill);background:var(--line-2);margin:0 auto var(--sp-2)}
.dn-item{position:relative;display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-2);
  border-radius:var(--r-lg);background:none;border:none;color:var(--muted);
  font-size:var(--fs-md);text-align:left;transition:.18s;width:100%}
.dn-item .ic{width:34px;height:34px;border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;
  background:var(--dim-wash);flex:none;transition:.18s}
.dn-item:hover{color:var(--ink)}
.dn-item:hover .ic{background:var(--accent-wash);box-shadow:var(--glow-nav);transform:translateY(-1px)}
.dn-item.on{color:var(--ink)}
.dn-item.on::after{content:"";position:absolute;left:calc(-1 * var(--sp-1));top:50%;width:3px;height:18px;
  border-radius:var(--r-pill);background:var(--cy);box-shadow:var(--glow-cur);transform:translateY(-50%)}
.dn-item.on .ic{background:var(--grad-accent);box-shadow:var(--glow-cur)}
.dn-foot{margin-top:var(--sp-2)}
#pin-btn{width:100%}
#mtabs{display:none}
.wk-fold{margin-bottom:var(--sp-2)}
.wk-fold summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:var(--sp-2);
  font-size:var(--fs-lg);color:var(--cy);font-weight:600;padding:var(--sp-2) 0}
.wk-fold summary::-webkit-details-marker{display:none}
.wk-fold summary .tg{color:var(--soft);font-size:var(--fs-xs)}
.wk-fold summary::after{content:"▾";color:var(--soft);margin-left:auto}
.wk-fold:not([open]) summary::after{content:"▸"}
@media (min-width:1150px){.duo{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-4);align-items:stretch}}
.duo .panel{display:flex;flex-direction:column}
.duo .panel .insight{margin-top:auto;padding-top:var(--sp-3);border-top:1px dashed var(--line);border-bottom:none}
.clock{font-family:var(--font-mono);font-size:var(--fs-xs);color:var(--soft);letter-spacing:.1em;white-space:nowrap}
.btn{padding:var(--sp-3) var(--sp-5);border-radius:var(--r-pill);border:1px solid var(--cy-line-2);
  background:var(--accent-wash);color:var(--cy);font-size:var(--fs-md);transition:.2s;white-space:nowrap}
.btn:hover{box-shadow:var(--glow-btn);transform:translateY(-1px)}
.btn.solid{background:var(--grad-accent);color:var(--on-accent);font-weight:700;border:none}
.btn.solid:hover{filter:brightness(1.08)}
.btn.sm{padding:var(--sp-2) var(--sp-3);font-size:var(--fs-sm)}
.btn.ghost{background:transparent;border-color:var(--line-2);color:var(--muted)}
.btn.ghost:hover{color:var(--cy);border-color:var(--cy-line)}
.btn.danger:hover{color:var(--bad);border-color:var(--bad-line)}
#search{width:210px}

/* ===== KPI 数据带（L1）===== */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--sp-4);margin:var(--sp-6) 0 var(--sp-2)}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:var(--sp-5) var(--sp-6);backdrop-filter:blur(10px);position:relative;
  overflow:hidden;animation:rise .6s both}
.kpi:nth-child(2){animation-delay:.08s}.kpi:nth-child(3){animation-delay:.16s}.kpi:nth-child(4){animation-delay:.24s}
.kpi::after{content:"";position:absolute;top:0;left:0;right:0;height:var(--sp-1);
  background:linear-gradient(90deg,transparent,var(--ac,var(--cy)),transparent)}
.kpi .lab{font-size:var(--fs-sm);color:var(--muted)}
.kpi .num{font-family:var(--font-mono);font-size:var(--fs-num);font-weight:700;margin-top:var(--sp-1);color:var(--ac,var(--cy))}
.kpi .sub{font-size:var(--fs-xs);color:var(--soft);margin-top:var(--sp-1)}

/* ===== 星轨轨道（L2）===== */
.track-zone{position:relative;margin:var(--sp-8) var(--sp-3) 0;height:118px}
.track{position:absolute;top:var(--track-top);left:3%;right:3%;height:3px;border-radius:var(--sp-1);
  background:var(--grad-track);box-shadow:var(--glow-track)}
.shuttle{position:absolute;top:var(--shuttle-top);width:13px;height:13px;border-radius:50%;
  background:var(--bright);box-shadow:var(--glow-track);animation:travel 10s ease-in-out infinite alternate;z-index:3}
@keyframes travel{from{left:3%}to{left:calc(97% - 13px)}}
.station{position:absolute;top:0;width:var(--station-w);margin-left:calc(var(--station-w) / -2);text-align:center;z-index:2}
.station .node{width:22px;height:22px;margin:var(--node-top) auto 0;border-radius:50%;
  border:2px solid var(--sc);background:var(--bg);box-shadow:var(--glow-node);transition:.25s;position:relative}
.station:hover .node{transform:scale(1.3)}
.station .node::after{content:"";position:absolute;inset:5px;border-radius:50%;
  background:var(--sc);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.station .name{font-size:var(--fs-md);font-weight:600;position:absolute;top:0;left:0;right:0;color:var(--sc)}
.station .cnt{font-family:var(--font-mono);font-size:var(--fs-2xs);color:var(--soft);
  position:absolute;top:var(--cnt-top);left:0;right:0}
.station .num-tag{font-family:var(--font-mono);font-size:var(--fs-2xs);color:var(--soft);
  letter-spacing:.2em;position:absolute;top:var(--numtag-top);left:0;right:0}

/* ===== 舱体 ===== */
.pods{display:grid;grid-template-columns:repeat(6,1fr);gap:var(--pods-gap);padding:var(--sp-2) 0 var(--sp-3)}
.pod-col{display:flex;flex-direction:column;gap:var(--sp-3);min-width:0}
.pod{background:var(--panel-2);border:1px solid var(--line);border-left:3px solid var(--sc,var(--cy));
  border-radius:var(--r-md);padding:var(--sp-4);backdrop-filter:blur(8px);
  transition:.22s;animation:drop .55s both;position:relative}
.pod:hover{transform:translateY(-3px);border-color:var(--sc,var(--cy));box-shadow:var(--glow-pod)}
.pod .t{font-size:var(--fs-sm);font-weight:600;line-height:1.45}
.pod .m{display:flex;gap:var(--sp-2);margin-top:var(--sp-3);flex-wrap:wrap}
@keyframes drop{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.empty-col{font-size:var(--fs-xs);color:var(--soft);text-align:center;padding:var(--sp-3) 0}

/* ===== 标签 ===== */
.tag{font-size:var(--fs-xs);padding:var(--sp-1) var(--sp-3);border-radius:var(--r-pill);
  border:1px solid var(--cy-line);color:var(--cy);white-space:nowrap}
.tag.dim{color:var(--muted);border-color:var(--line)}
.tag.ok{color:var(--ok);border-color:var(--ok-line)}
.tag.bad{color:var(--bad);border-color:var(--bad-line)}
.tag.pend-tag{color:var(--warn);border-color:var(--warn-line-2);background:var(--warn-wash)}
.tag.acct-tag{border-color:var(--line)}

/* ===== 通用面板 / 视图头 ===== */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);
  backdrop-filter:blur(10px);padding:var(--sp-5) var(--sp-6);animation:rise .5s both}
.view{animation:fadev .35s ease}
@keyframes fadev{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.vhead{display:flex;align-items:center;gap:var(--sp-3);margin:var(--sp-6) 0 var(--sp-4);flex-wrap:wrap}
.vhead h2{font-size:var(--fs-h2);font-weight:700}
.vhead h2::before{content:"◈ ";color:var(--cy)}
.pipe-head{display:flex;align-items:center;gap:var(--sp-3);margin:var(--sp-5) 0 var(--sp-2);flex-wrap:wrap}
.lab{font-size:var(--fs-sm);color:var(--soft)}
.hint{font-size:var(--fs-xs);color:var(--soft)}
.flex1{flex:1}
.sub-h{font-size:var(--fs-lg);margin:var(--sp-5) 0 var(--sp-3);color:var(--cy);font-weight:600}
.sub-h::before{content:"▎"}
.col-h{font-size:var(--fs-lg);margin:var(--sp-6) 0 var(--sp-3);color:var(--cy);font-weight:600;
  display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap}
.col-h::before{content:"▎"}
.nowrap{white-space:nowrap}

/* ===== seg 切换 ===== */
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line-2);
  border-radius:var(--r-pill);padding:var(--sp-1)}
.seg button{border:none;background:none;color:var(--muted);font-size:var(--fs-sm);
  padding:var(--sp-2) var(--sp-3);border-radius:var(--r-pill)}
.seg button.on{background:var(--accent-wash);color:var(--cy)}

/* ===== 平台筛选芯片 ===== */
.fbar{display:inline-flex;gap:var(--sp-2);flex-wrap:wrap;align-items:center}
.fchip{padding:var(--sp-2) var(--sp-3);border-radius:var(--r-pill);border:1px solid var(--line-2);
  background:var(--panel);color:var(--muted);font-size:var(--fs-sm);transition:.2s;
  display:inline-flex;align-items:center;gap:var(--sp-2)}
.fchip .dot{width:7px;height:7px;border-radius:50%;background:var(--fc,var(--muted));flex:none}
.fchip:hover{color:var(--fc,var(--cy));border-color:var(--fc,var(--cy))}
.fchip.on{color:var(--fc,var(--cy));border-color:var(--fc,var(--cy));
  background:color-mix(in srgb,var(--fc,var(--cy)) 12%,transparent);box-shadow:var(--glow-chip)}

/* ===== 表格 ===== */
.tbl{width:100%;border-collapse:collapse;font-size:var(--fs-md)}
.tbl th{text-align:left;font-size:var(--fs-xs);color:var(--soft);font-weight:500;
  padding:var(--sp-3) var(--sp-4);border-bottom:1px solid var(--line-2);letter-spacing:.05em}
.tbl td{padding:var(--sp-3) var(--sp-4);border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:hover td{background:var(--hover-wash)}
.table-panel{padding:0;overflow:auto}
.td-title{max-width:300px}
.pill{font-size:var(--fs-xs);padding:var(--sp-1) var(--sp-3);border-radius:var(--r-pill);
  border:1px solid var(--line-2);white-space:nowrap}
.empty-cell{color:var(--soft);text-align:center;padding:var(--sp-9) 0;font-size:var(--fs-md)}
.empty-panel{text-align:center;color:var(--soft);padding:var(--sp-10) 0;margin-top:var(--sp-5);font-size:var(--fs-md)}

/* ===== 选题周报 ===== */
.wk-item{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-md);
  padding:var(--sp-5) var(--sp-6);margin-bottom:var(--sp-3);transition:.2s;animation:rise .5s both}
.wk-item:hover{border-color:var(--cy-line-2);box-shadow:var(--shadow-pop)}
.wk-item.handled{opacity:.55}
.wk-title{font-size:var(--fs-lg);font-weight:650;display:flex;gap:var(--sp-3);align-items:center;flex-wrap:wrap}
.wk-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3) var(--sp-6);margin:var(--sp-3) 0}
.wk-b .lab{font-size:var(--fs-xs);color:var(--soft);letter-spacing:.08em;margin-bottom:var(--sp-1)}
.wk-b .val{font-size:var(--fs-sm)}
.wk-act{display:flex;gap:var(--sp-2);border-top:1px solid var(--line);padding-top:var(--sp-3);flex-wrap:wrap}
.hist{margin-bottom:var(--sp-2)}
.hist summary{cursor:pointer;font-size:var(--fs-md);color:var(--muted)}
.hist summary:hover{color:var(--cy)}
.hist-body{margin-top:var(--sp-4)}

/* ===== 排期日历 ===== */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:var(--sp-2)}
.cal-dow{font-size:var(--fs-xs);color:var(--soft);text-align:center;padding:var(--sp-2) 0}
.cal-cell{min-height:88px;background:var(--dim-wash);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:var(--sp-2);transition:.2s}
.cal-cell:hover{border-color:var(--cy-line-2)}
.cal-cell.dim{opacity:.3}
.cal-cell .d{font-size:var(--fs-xs);color:var(--soft);margin-bottom:var(--sp-2)}
.chip{font-size:var(--fs-xs);padding:var(--sp-1) var(--sp-3);border-radius:var(--r-sm);
  margin-bottom:var(--sp-1);display:block;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;border:1px solid transparent;transition:.18s}
.chip:hover{border-color:var(--cy)}
.chip.pend{background:var(--warn-wash);color:var(--warn);border-color:var(--warn-line);cursor:pointer}
.chip.pend:hover{border-color:var(--warn-line-2)}
.dim-txt{opacity:.65}
.pend-panel{margin-bottom:var(--sp-4)}

async function bootState(){
  if(window.EMBEDDED_DEMO && window.EMBEDDED_STATE){
    demoMode = true; online = false;
    S = migrate(JSON.parse(JSON.stringify(window.EMBEDDED_STATE)));
    const cb=document.getElementById("config-btn"); if(cb) cb.style.display="none";
    bootReady = true; route(); return;
  }
  try{
    const d = await api("/state");
    stateVersion = d.version;
    S = migrate(d.state ? JSON.parse(JSON.stringify(d.state)) : seedState());
    const r = await api("/state",{method:"PUT",body:JSON.stringify({baseVersion:stateVersion,state:S})});
    stateVersion = r.version;
    online = true;
    api("/nodes").then(d=>{SYS_NODES=d.nodes||[];}).catch(()=>{});
    api("/config").then(c=>{INBOX_STATUS_LAST=(c.inbox&&c.inbox.lastScan)||"";INBOX_PENDING=(c.inbox&&c.inbox.pending)||0;}).catch(()=>{});
  }catch(e){
    online = false;
    let local = null;
    try{ local = JSON.parse(localStorage.getItem(LS_KEY)); }catch(_){}
    S = migrate(local || seedState());
    setTimeout(()=>toast("⚠ 服务未连接，已切换本地演示模式（数据仅存本机）",true),800);
  }
  bootReady = true; route();
}
function pushState(immediate){
  if(!online){ try{localStorage.setItem(LS_KEY,JSON.stringify(S))}catch(_){}; return; }
  if(!immediate){ clearTimeout(syncTimer); syncTimer=setTimeout(()=>pushState(true),400); return; }
  api("/state",{method:"PUT",body:JSON.stringify({baseVersion:stateVersion,state:S})})
    .then(d=>{ stateVersion=d.version; }).catch(()=>{});
}
const save = () => pushState();
setInterval(async()=>{

/* ============================================================
   状态机引擎（PRD §4：自动 + 手动并存，审批链配置驱动）
============================================================ */
function setStatus(c, st, opts={}){
  const from=c.status; if(from===st) return;
  if(st==="审批中" && !opts.keepApproval){
    const chain=CHAINS[brandOf(c.accountId)];
    const hasOpen = c.approval && c.approval.chain.some(n=>!n.result);
    if(hasOpen){ addLog(c,"回到「审批中」，恢复原审批进度（不新增轮次）"); }
    else{
      c.approval={round:(c.approval?c.approval.round+1:1),
        chain:chain.map(n=>({name:n,result:null,comment:"",time:null}))};
      addLog(c,`送审：进入「审批中」，加载${brandOf(c.accountId)} ${chain.length} 级审批链（第 ${c.approval.round} 轮）`);
    }
  } else addLog(c, opts.auto || `手动流转：${from} → ${st}`);
  c.status=st; c.statusEnteredAt=Date.now();
  if(st==="已发布" && !c.publishDate)
    c.publishDate=(c.scheduleDate&&c.scheduleDate!=="待定")?c.scheduleDate:fmtD(Date.now());
  save();
}
function approveNode(cardId){
  const c=getCard(cardId); if(!c||c.status!=="审批中"||!c.approval)return;
  const i=c.approval.chain.findIndex(n=>!n.result); if(i<0)return;
  const node=c.approval.chain[i], cm=(document.getElementById("appr-comment")||{}).value||"";
  node.result="通过"; node.comment=cm; node.time=Date.now();
  addLog(c,`${node.name} 审批通过${cm?"："+cm:""}`);
  if(c.approval.chain.every(n=>n.result==="通过")){
    setStatus(c,"制作中",{auto:"审批链全部通过，自动流转至「制作中」"});
    toast("✅ 审批链全部通过，已自动流转「制作中」");
  } else toast(`✓ ${node.name} 审批通过`);
  render(); renderDrawer();
}
function rejectNode(cardId){
  const c=getCard(cardId); if(!c||c.status!=="审批中"||!c.approval)return;
  const i=c.approval.chain.findIndex(n=>!n.result); if(i<0)return;
  const node=c.approval.chain[i], cm=(document.getElementById("appr-comment")||{}).value||"";
  node.result="驳回"; node.comment=cm; node.time=Date.now();
  addLog(c,`${node.name} 驳回${cm?"："+cm:""}，自动退回「脚本中」`);
  setStatus(c,"脚本中",{auto:`${node.name} 驳回，自动退回「脚本中」`});
  toast(`✕ ${node.name} 驳回，已退回「脚本中」`,true);
  render(); renderDrawer();
}
function shelveCard(id){
  const c=getCard(id); if(!c)return;
  setStatus(c,"已搁置",{auto:"🗄 搁置：全部过程资产封存于归档库"});
  closeDrawer(); render(); toast("🗄 已搁置，过程资产完整保留于归档库");
}
function reviveCard(id){
  const c=getCard(id); if(!c)return;
  setStatus(c,"待筛选",{auto:"↺ 复活：已搁置 → 待筛选"});
  render(); renderDrawer(); toast("↺ 已复活回看板「待筛选」，全部资产保留");
}

    <span class="hint">每栏目 ≥5 条 · 4 区块卡片 · 档一人工触发，档二起每周自动</span>
    <div class="flex1"></div>
    <button class="btn solid sm" data-act="gen-report">⚡ 生成本周周报</button></div>
    <div class="pipe-head"><span class="lab">按平台筛选</span>${fbarHTML(wkCount)}</div>`;
  if(!cur.length) return body+`<div class="panel empty-panel">本周周报尚未生成<br><span class="hint">点击右上角「生成本周周报」，将按各账号栏目关键词包 + 定位聚合热点选题</span></div>`;
  cur.forEach(r=>{
    body+=`<div class="col-h"><span class="tag" style="color:var(${acctTk(r.accountId)});border-color:color-mix(in srgb,var(${acctTk(r.accountId)}) 40%,transparent)">${acctName(r.accountId)}</span>
      <span class="hint">生成于 ${fmtT(r.generatedAt)} · 共 ${r.items.length} 条 · 待处理 ${r.items.filter(i=>i.status==="待处理").length} 条</span></div>`;
    (S.columns[r.accountId]||[]).forEach(col=>{
      const items=r.items.filter(i=>i.columnId===col.id);
      if(!items.length)return;
      body+=`<details class="wk-fold" ${isMobile()?"":"open"}><summary>▎${esc(col.name)} <span class="tg">${items.length} 条</span></summary>
        <div style="padding-top:var(--sp-2)">${items.map(it=>wkItemHTML(r,it,false)).join("")}</div></details>`;
    });
  });
  if(hist.length){
    body+=`<div class="col-h" style="color:var(--muted)">历史周报 <span class="hint">观望中的选题留在池内，跨期可捞回</span></div>`;
    hist.forEach(r=>{
      const wait=r.items.filter(i=>i.status==="观望").length;
      body+=`<details class="panel hist"><summary>🗞 ${acctName(r.accountId)} · ${r.week} · ${r.items.length} 条（观望 ${wait} 条可捞回）</summary>
        <div class="hist-body">${r.items.map(it=>wkItemHTML(r,it,true)).join("")}</div></details>`;
    });
  }
  return body;
}
</script>

<script>
/* ============================================================
   视图 3：排期日历（PRD §5.4 · 真实数据联动 + 待定区跳转）
============================================================ */
function viewCal(){
  const base=new Date(); base.setDate(1); base.setMonth(base.getMonth()+calOffset);
  const y=base.getFullYear(), m=base.getMonth();
  const firstDow=(new Date(y,m,1).getDay()+6)%7;
  const days=new Date(y,m+1,0).getDate();
  const scope=S.cards.filter(c=>inFacet(c.accountId)&&c.status!=="已搁置"&&qMatch(c));
  const pend=scope.filter(c=>c.scheduleDate==="待定");
  const byDate={};
  scope.filter(c=>c.scheduleDate&&c.scheduleDate!=="待定").forEach(c=>{(byDate[c.scheduleDate]=byDate[c.scheduleDate]||[]).push(c)});
  const todayKey=fmtD(Date.now());
  let cells=["一","二","三","四","五","六","日"].map(d=>`<div class="cal-dow">周${d}</div>`).join("");
  for(let i=0;i<firstDow;i++)cells+=`<div class="cal-cell dim"></div>`;
  for(let d=1;d<=days;d++){
    const key=`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const isToday=key===todayKey;
    cells+=`<div class="cal-cell" style="${isToday?"border-color:var(--cy);box-shadow:var(--inset-cal)":""}">
      <div class="d" style="${isToday?"color:var(--cy);font-weight:700":""}">${d}</div>
      ${(byDate[key]||[]).map(c=>`<span class="chip" data-act="open-card" data-id="${c.id}"
        style="background:color-mix(in srgb,var(${acctTk(c.accountId)}) 14%,transparent);color:var(${acctTk(c.accountId)});border-color:color-mix(in srgb,var(${acctTk(c.accountId)}) 40%,transparent)"
        title="${esc(c.title)}">${esc(c.title)}</span>`).join("")}</div>`;
  }
  return `<div class="vhead"><h2>排期日历</h2>
    <div class="seg">
      <button data-act="cal-prev">‹ 上月</button>
      <button data-act="cal-today" class="${calOffset===0?"on":""}">${y} 年 ${m+1} 月</button>
      <button data-act="cal-next">下月 ›</button></div>
    <div class="flex1"></div>${fbarHTML()}</div>
    ${pend.length?`<div class="panel pend-panel"><h4>📌 待定区（${pend.length}）· 点击跳转流水线定位</h4>
      <div class="pend-list">${pend.map(c=>`<span class="chip pend" data-act="pend-jump" data-id="${c.id}"
        title="待定原因：${esc(pendReason(c))}">⏳ ${esc(c.title)}<span class="dim-txt"> · ${acctName(c.accountId)} · 在「${c.status}」</span></span>`).join("")}</div></div>`:""}
    <div class="cal-grid">${cells}</div>`;
}
function jumpPend(id){
  const c=getCard(id); if(!c)return;
  if(!inFacet(c.accountId))FACET="all";
  MODE="track"; clearHash(); CUR="pipe"; render();
  setTimeout(()=>{
    const el=document.querySelector(`.pod[data-id="${id}"]`);
    if(el){el.scrollIntoView({behavior:"smooth",block:"center"});el.classList.add("flash");
      setTimeout(()=>el.classList.remove("flash"),3200);}
  },120);
  toast(`⏳「${c.title}」当前在「${c.status}」· 待定原因：${pendReason(c)}`);
}

/* ============================================================
   视图 4：归档库（PRD §5.7）  视图 5：栏目设置（PRD §5.6）
============================================================ */
function viewArch(){
  const scope=S.cards.filter(c=>inFacet(c.accountId));
  let list=scope.filter(c=>c.status==="已搁置"||c.status==="已发布");
  if(archFilter.status!=="全部")list=list.filter(c=>c.status===archFilter.status);
  if(archFilter.col!=="全部")list=list.filter(c=>c.columnId===archFilter.col);
  if(archFilter.q)list=list.filter(c=>c.title.includes(archFilter.q));
  const scopeIds=FACET==="all"?ACCTS.map(a=>a.id):[FACET];
  const colOpts=[]; scopeIds.forEach(aid=>(S.columns[aid]||[]).forEach(c=>colOpts.push({id:c.id,label:acctName(aid)+" · "+c.name})));
  return `<div class="vhead"><h2>归档库</h2>
    <select data-af="status"><option ${archFilter.status==="全部"?"selected":""}>全部</option>
      <option ${archFilter.status==="已搁置"?"selected":""}>已搁置</option>
      <option ${archFilter.status==="已发布"?"selected":""}>已发布</option></select>
    <select data-af="col"><option value="全部">全部栏目</option>
      ${colOpts.map(o=>`<option value="${o.id}" ${archFilter.col===o.id?"selected":""}>${esc(o.label)}</option>`).join("")}</select>
    <input placeholder="关键词检索…" value="${esc(archFilter.q)}" data-afq="1" style="width:180px">
    <div class="flex1"></div><span class="hint">共 ${list.length} 条 · 已搁置可一键复活</span></div>
    <div class="panel table-panel"><table class="tbl">
      <tr><th>标题</th><th>账号</th><th>栏目</th><th>状态</th><th>发布日期</th><th>过程资产</th><th>操作</th></tr>
      ${list.map(c=>`<tr>
        <td class="td-title">${esc(c.title)}</td><td>${acctName(c.accountId)}</td>
        <td><span class="tag">${esc(colName(c.accountId,c.columnId))}</span></td>
        <td>${stPill(c.status)}</td><td>${c.publishDate||"—"}</td>
        <td class="hint">快照 ${c.snapshot?1:0} · 链接 ${c.links.length} · 日志 ${c.logs.length}</td>
        <td class="nowrap"><button class="btn sm ghost" data-act="open-card" data-id="${c.id}">查看</button>
          ${c.status==="已搁置"?`<button class="btn sm solid" data-act="revive" data-id="${c.id}">↺ 复活</button>`:""}</td></tr>`).join("")
        ||`<tr><td colspan="7" class="empty-cell">暂无归档选题</td></tr>`}
    </table></div>`;
}
function viewCols(){
  const aid=colAcct, bc=S.brandCards||{};
  return `<div class="vhead"><h2>栏目设置</h2>
    <span class="hint">栏目卡与品牌卡是周报生成的「配置源」：定位 / 画像 / 雷区 / 样例写得越具体，碰撞出的选题越准</span>
    <div class="flex1"></div>
    <button class="btn solid" data-act="save-cols">💾 保存配置</button></div>
  <div class="sub-h">品牌调性卡</div>
  ${["国寿","瑞众"].map(b=>{const c=bc[b]||{audience:"",tone:"",taboos:[]};
    return `<div class="panel" style="margin-bottom:var(--sp-3)">
      <div class="pipe-head" style="margin:0 0 var(--sp-3)"><strong style="font-size:var(--fs-md)">${b}</strong>
        <span class="tag" style="color:var(${b==="国寿"?"--ac-gs":"--ac-rzdy"});border-color:color-mix(in srgb,var(${b==="国寿"?"--ac-gs":"--ac-rzdy"}) 40%,transparent)">${ACCTS.filter(a=>a.brand===b).map(a=>a.name).join(" / ")}</span></div>
      <div class="row" style="gap:var(--sp-3);flex-wrap:wrap">
        <div class="field" style="flex:1"><label>受众画像</label><input value="${esc(c.audience)}" data-bf="audience" data-brand="${b}"></div>
        <div class="field" style="flex:1"><label>品牌调性</label><input value="${esc(c.tone)}" data-bf="tone" data-brand="${b}"></div>
        <div class="field" style="flex:1.4"><label>红线（分号分隔，生成时硬排除）</label><input value="${esc((c.taboos||[]).join("；"))}" data-bf="taboos" data-brand="${b}"></div>
      </div></div>`;}).join("")}
  <div class="sub-h">全局节点日历 <span class="hint">系统共享信号（品牌无关），生成时自动扫描未来 60 天，由碰撞决定是否契合某栏目</span></div>
  <div class="panel" style="margin-bottom:var(--sp-3)">
    ${SYS_NODES.length?SYS_NODES.map(n=>`<span class="tag" style="color:var(--warn);border-color:var(--warn-line);margin:0 var(--sp-2) var(--sp-2) 0">📆 ${n.date} ${n.name}（${n.days} 天后）</span>`).join(""):`<span class="hint">未来 60 天无节点，选题将全部来自当日热榜信号碰撞</span>`}
  </div>
  <div class="vhead" style="margin-top:var(--sp-5)"><div class="seg">${ACCTS.map(a=>`<button class="${a.id===aid?"on":""}" data-act="col-acct" data-id="${a.id}">${a.name}</button>`).join("")}</div>
    <div class="flex1"></div>
    <button class="btn" data-act="add-col">＋ 新增栏目</button></div>
  ${(S.columns[aid]||[]).map((c,i)=>`<div class="panel" style="margin-bottom:var(--sp-3)">
    <div class="pipe-head" style="margin:0 0 var(--sp-3)"><strong style="font-size:var(--fs-md)">栏目 ${i+1}</strong>
      <span class="tag ${c.ctype==="story"?"ok":"dim"}">${c.ctype==="story"?"◆ 故事型（找人）":"● 热点型"}</span>
      <div class="flex1"></div>
      <button class="btn sm ghost danger" data-act="del-col" data-id="${c.id}">删除</button></div>
    <div class="row" style="gap:var(--sp-3);flex-wrap:wrap">
      <div class="field" style="width:180px"><label>栏目名</label><input value="${esc(c.name)}" data-colf="name" data-colid="${c.id}"></div>
      <div class="field" style="flex:1"><label>定位描述</label><input value="${esc(c.pos)}" data-colf="pos" data-colid="${c.id}"></div>
      <div class="field" style="width:130px"><label>栏目类型</label>
        <select data-colf="ctype" data-colid="${c.id}">
          <option value="hot" ${c.ctype!=="story"?"selected":""}>热点型</option>
          <option value="story" ${c.ctype==="story"?"selected":""}>故事型（找人）</option></select></div>
      <div class="field" style="width:150px"><label>生成模式</label>
        <select data-colf="genMode" data-colid="${c.id}">
          <option value="weekly" ${c.genMode!=="calendar"&&c.genMode!=="project"?"selected":""}>周报制</option>
          <option value="calendar" ${c.genMode==="calendar"?"selected":""}>日历驱动</option>
          <option value="project" ${c.genMode==="project"?"selected":""}>项目制·专项</option></select></div>
      <div class="field" style="flex:1"><label>关键词包（逗号分隔）</label><input value="${esc((c.keywords||[]).join("，"))}" data-colf="keywords" data-colid="${c.id}"></div>
      <div class="field" style="flex:1"><label>选题偏好</label><input value="${esc(c.pref)}" data-colf="pref" data-colid="${c.id}"></div>
    </div>
    ${c.genMode==="project"?`<div class="hint" style="margin-bottom:var(--sp-3)">🔒 项目制栏目走「专项模式」手动触发，不进周报生成（专项看板即将上线）</div>`:""}
    ${c.ctype==="story"?`<div class="field"><label>找人画像维度（恒定的「选人提问模板」；具体的人是每次生成的产出）</label><input value="${esc(c.findProfile)}" data-colf="findProfile" data-colid="${c.id}"></div>`:""}
    <div class="field"><label>雷区（分号分隔，生成时硬排除）</label><input value="${esc((c.taboos||[]).join("；"))}" data-colf="taboosJoin" data-colid="${c.id}"></div>
    <div class="field"><label>定义卡全文（注入生成引擎的 {{栏目定义卡}}；轨道/子系列/心智句等自定义规则写在这里，改卡不改码）</label>
      <textarea rows="6" data-colf="cardMd" data-colid="${c.id}">${esc(c.cardMd||"")}</textarea></div>
    <div class="row" style="gap:var(--sp-3);align-items:flex-start">
      <div class="field" style="flex:1"><label>✅ 好样例选题</label><textarea rows="2" data-colf="goodSample" data-colid="${c.id}">${esc(c.goodSample)}</textarea></div>
      <div class="field" style="flex:1"><label>❌ 坏样例选题</label><textarea rows="2" data-colf="badSample" data-colid="${c.id}">${esc(c.badSample)}</textarea></div>

<script>
/* ============================================================
   卡片详情抽屉（PRD §5.3 · 交接口 B + 审批痕迹 + 溯源快照）
============================================================ */
function openDrawer(id){ drawerId=id;
  document.getElementById("drawer").classList.add("open");
  document.getElementById("drawer-mask").classList.add("open"); renderDrawer(); }
function closeDrawer(){ drawerId=null;
  document.getElementById("drawer").classList.remove("open");
  document.getElementById("drawer-mask").classList.remove("open"); }
function renderDrawer(){
  const c=getCard(drawerId); if(!c){closeDrawer();return;}
  const curIdx=STATUSES.indexOf(c.status), shelved=c.status==="已搁置";
  const steps=STATUSES.map((st,i)=>{
    const cls=shelved?"":i<curIdx?"done":i===curIdx?"cur":"";
    return `<div class="step ${cls}" ${shelved?"":`data-act="step" data-st="${st}"`} title="${shelved?"已封存":"点击流转到「"+st+"」"}">
      <div class="n">${i<curIdx&&!shelved?"✓":i+1}</div><div class="s">${st}</div></div>`;}).join("");
  let apprHTML="";
  if(c.approval){
    const pi=c.approval.chain.findIndex(n=>!n.result);
    apprHTML=`<div class="sec"><h4>审批痕迹 · ${brandOf(c.accountId)} ${c.approval.chain.length} 级链（第 ${c.approval.round} 轮）</h4>
      ${c.approval.chain.map((n,i)=>{
        const cls=n.result==="通过"?"pass":n.result==="驳回"?"fail":(i===pi&&c.status==="审批中")?"pending":"";
        const stat=n.result?stPill(n.result):(i===pi&&c.status==="审批中")?`<span class="tag" style="color:var(--cy);border-color:var(--cy-line-2)">待审批</span>`:`<span class="tag dim">等待中</span>`;
        return `<div class="appr-node ${cls}"><div class="appr-row">
          <span class="who">${i+1}. ${esc(n.name)}</span>${stat}
          ${n.time?`<span class="hint">${fmtT(n.time)}</span>`:""}</div>
          ${n.comment?`<div class="appr-cmt">💬 ${esc(n.comment)}</div>`:""}
          ${i===pi&&c.status==="审批中"?`<div class="row" style="margin-top:var(--sp-3)">
            <input id="appr-comment" placeholder="审批意见（可选）…" style="flex:1">
            <button class="btn sm solid" data-act="approve">✓ 通过</button>
            <button class="btn sm ghost danger" data-act="reject">✕ 驳回</button></div>`:""}
        </div>`;}).join("")}
      <div class="hint" style="margin-top:var(--sp-3)">客户/上级意见经微信反馈，由内部人员代录到对应节点（PRD §4.3）</div></div>`;
  }
  document.getElementById("drawer").innerHTML=`
    <div class="drawer-head"><strong>选题卡片详情</strong><span class="hint">ID ${c.id} · ${c.source}</span>
      <div class="flex1"></div><button class="btn sm ghost" data-act="close-drawer">✕ 关闭</button></div>
    <div style="font-size:var(--fs-xl);font-weight:700;line-height:1.5;margin-top:var(--sp-4)">${esc(c.title)}</div>
    <div style="display:flex;gap:var(--sp-2);margin-top:var(--sp-2);flex-wrap:wrap">
      <span class="tag">${esc(colName(c.accountId,c.columnId))}</span>${acctTag(c.accountId)}${stPill(c.status)}
      ${shelved?`<span class="tag" style="color:var(--warn);border-color:var(--warn-line-2)">已封存于归档库</span>`:""}</div>
    <div class="steps">${steps}</div>
    <div class="hint" style="text-align:center;margin-bottom:var(--sp-2)">${shelved?"已搁置，复活后可继续流转":`点击步骤可手动流转（兜底）· 当前停留 ${daysIn(c)} 天`}</div>
    <div class="row" style="margin-bottom:var(--sp-2)">
      ${shelved?`<button class="btn solid" style="flex:1" data-act="revive" data-id="${c.id}">↺ 复活回看板</button>`
        :`<button class="btn ghost danger" style="flex:1" data-act="shelve" data-id="${c.id}">🗄 搁置此选题（保留全部资产）</button>`}
    </div>
    <div class="sec"><h4>基础信息</h4>
      <div class="row" style="gap:var(--sp-3)">
        <div class="field" style="flex:1;margin:0"><label>负责人</label>
          <input data-cf="owner" value="${esc(c.owner)}"></div>
        <div class="field" style="flex:1;margin:0"><label>预计发布日期</label>
          <div class="row"><input type="date" data-cf="schedDate" value="${c.scheduleDate&&c.scheduleDate!=="待定"?c.scheduleDate:""}" style="flex:1" ${c.scheduleDate==="待定"?"disabled":""}>
            <label class="tbd"><input type="checkbox" data-cf="schedTbd" ${c.scheduleDate==="待定"?"checked":""}>待定</label></div></div>
      </div>
      ${c.adoptNote?`<div class="kv" style="margin-top:var(--sp-2)"><span class="k">采纳想法</span><span>${esc(c.adoptNote)}</span></div>`:""}
      ${c.scheduleDate==="待定"?`<div class="kv" style="margin-top:var(--sp-2)"><span class="k">待定原因</span><span>${esc(pendReason(c))}</span></div>`:""}
    </div>
    <div class="sec"><h4>终稿载体（交接口 B）</h4>
      ${c.links.map(l=>`<div class="link-row">
        <span class="tag" style="color:var(--link);border-color:var(--link-line)">${esc(l.type)}</span>
        <a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.url)}</a>
        <span class="hint">${fmtD(l.addedAt)}</span></div>`).join("")
      ||`<div class="hint" style="margin-bottom:var(--sp-2)">暂无链接 — 外部 AI 成稿 / 分秒针成片在此回填挂载</div>`}
      <div class="row" style="margin-top:var(--sp-3)">
        <select id="link-type">${LINK_TYPES.map(t=>`<option>${t}</option>`).join("")}</select>
        <input id="link-url" placeholder="粘贴 URL…" style="flex:1">
        <button class="btn sm solid" data-act="add-link">＋ 添加最终链接</button></div>
    </div>
    ${apprHTML}
    ${c.snapshot?`<div class="sec"><details class="snap"><summary>📎 来源快照（溯源起点 · 不可编辑）</summary>
      <div class="kv" style="margin-top:var(--sp-2)">
        ${c.snapshot.url?`<span class="k">原始链接</span><a href="${esc(c.snapshot.url)}" target="_blank" rel="noopener">${esc(c.snapshot.url)}</a>`:""}
        <span class="k">抓取热度</span><span>${esc(c.snapshot.heat)}</span>
        <span class="k">品牌关联</span><span>${esc(c.snapshot.relation)}</span>
        <span class="k">创意方向</span><span>${esc(c.snapshot.creative)}</span></div></details></div>`:""}
    <div class="sec"><h4>操作日志（倒序）</h4>
      ${c.logs.map(l=>`<div class="log-item"><span class="time">${fmtT(l.time)}</span><span><strong>${esc(l.who)}</strong> ${esc(l.action)}</span></div>`).join("")
      ||`<div class="hint">暂无记录</div>`}</div>
    <div class="row" style="margin-top:var(--sp-3)">
      <button class="btn ghost" style="flex:1" data-act="copy-card" data-id="${c.id}">📋 复制卡片给外部 AI（交接口 A）</button></div>`;
}
function cardText(c){
  if(c.handoffPrompt) return c.handoffPrompt;
  const a=acct(c.accountId), col=(S.columns[c.accountId]||[]).find(x=>x.id===c.columnId);

/* ============================================================
   视图 6：数据看板（趋势优先 · 纯 SVG 图表 · 参照抖音运营指标体系）
   指标依据：播放量=流量趋势看环比；互动率=互动量÷播放量；
   完播率/涨粉暂无数据源（标注缺口）
============================================================ */
const fmtW = v => v>=1e8 ? (v/1e8).toFixed(1)+"亿" : v>=1e4 ? Math.round(v/1e4)+"w" : String(Math.round(v||0));
function _pct(a,b){ return b?Math.round((a-b)/b*100):null; }
function _arr(v){ if(v===null||v===undefined||!isFinite(v)) return "";
  return `<tspan style="fill:var(${v>=0?"--bad":"--ok"})">${v>=0?"▲":"▼"}${Math.abs(v)}%</tspan>`; }
function _svgFrame(W,H,L,R,T,B,grid,fmtY){
  let g="";
  grid.forEach(gd=>{ const y=gd[1];
    g+=`<line x1="${L}" y1="${y.toFixed(1)}" x2="${W-R}" y2="${y.toFixed(1)}" style="stroke:var(--line)"/>`+
       `<text x="${L-8}" y="${(y+4).toFixed(1)}" text-anchor="end" style="fill:var(--soft);font-size:var(--fs-2xs)">${fmtY?fmtY(gd[0]):gd[0]}</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${g}`;
}
function _chartPlays(M,mode){
  const W=840,H=300,L=58,R=18,T=34,B=44,n=M.length;
  if(n<2) return `<div class="panel" style="text-align:center;color:var(--soft)">数据不足</div>`;
  const vals=M.map(m=>m.plays);
  const xs=i=>L+(W-L-R)*i/(n-1);
  let ymap,grid;
  if(mode==="log"){
    const lo=Math.floor(Math.log10(Math.min(...vals))),hi=Math.ceil(Math.log10(Math.max(...vals)))+0.2;
    ymap=v=>T+(H-T-B)*(1-(Math.log10(Math.max(v,1))-lo)/(hi-lo));
    grid=[];for(let p=lo;p<=hi;p++)grid.push([Math.pow(10,p),ymap(Math.pow(10,p)),fmtW(Math.pow(10,p))]);
  }else{
    const hi=Math.max(...vals)*1.18;
    ymap=v=>T+(H-T-B)*(1-v/hi);
    grid=[0,1,2,3,4].map(i=>[hi*i/4,ymap(hi*i/4),fmtW(hi*i/4)]);
  }
  const pts=M.map((m,i)=>[xs(i),ymap(m.plays)]);
  let svg=_svgFrame(W,H,L,R,T,B,grid,fmtW);
  svg+=`<path d="${pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ")} L ${pts[n-1][0].toFixed(1)},${(H-B)} L ${pts[0][0].toFixed(1)},${(H-B)} Z" style="fill:color-mix(in srgb,var(--cy) 10%,transparent);stroke:none"/>`;
  svg+=`<polyline points="${pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ")}" style="fill:none;stroke:var(--cy);stroke-width:2.5"/>`;
  M.forEach((m,i)=>{
    const [x,y]=pts[i];
    svg+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.5" style="fill:var(--bg);stroke:var(--cy);stroke-width:2"/>`;
    svg+=`<text x="${x.toFixed(1)}" y="${(y-9).toFixed(1)}" text-anchor="middle" style="fill:var(--ink);font-size:var(--fs-2xs);font-weight:600">${fmtW(m.plays)}</text>`;
    if(i>0){ const p=_pct(m.plays,M[i-1].plays);
      svg+=`<text x="${x.toFixed(1)}" y="${(H-B+13).toFixed(1)}" text-anchor="middle" style="font-size:var(--fs-2xs)">${_arr(p)}</text>`; }
    svg+=`<text x="${x.toFixed(1)}" y="${(H-B+28).toFixed(1)}" text-anchor="middle" style="fill:var(--soft);font-size:var(--fs-2xs)">${m.k.slice(2).replace("-","/")}</text>`;
  });
  return svg+`</svg>`;
}
function _chartRate(M,avg,bench){
  const W=840,H=300,L=52,R=18,T=30,B=36,n=M.length;
  if(n<2) return `<div class="panel" style="text-align:center;color:var(--soft)">数据不足</div>`;
  const vals=M.map(m=>m.rate);
  const hi=Math.max(...vals,avg)*1.25, lo=Math.min(...vals,avg)*0.7;
  const xs=i=>L+(W-L-R)*i/(n-1);
  const ymap=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  let svg=_svgFrame(W,H,L,R,T,B,[2,3,4,5,6].filter(v=>v<=hi&&v>=lo).map(v=>[v,ymap(v),v+"%"]));
  const yavg=ymap(avg);
  svg+=`<line x1="${L}" y1="${yavg.toFixed(1)}" x2="${W-R}" y2="${yavg.toFixed(1)}" style="stroke:var(--warn);stroke-dasharray:5 4"/>`;
  svg+=`<text x="${W-R}" y="${(yavg-6).toFixed(1)}" text-anchor="end" style="fill:var(--warn);font-size:var(--fs-2xs)">全期均值 ${avg.toFixed(1)}%</text>`;
  if(bench&&bench.rate>lo&&bench.rate<hi){
    const yb=ymap(bench.rate);
    svg+=`<line x1="${L}" y1="${yb.toFixed(1)}" x2="${W-R}" y2="${yb.toFixed(1)}" style="stroke:var(--link);stroke-dasharray:2 4"/>`;
    svg+=`<text x="${L+4}" y="${(yb-6).toFixed(1)}" style="fill:var(--link);font-size:var(--fs-2xs)">${bench.label||"行业基准"} ${bench.rate}%</text>`;
  }
  const pts=M.map((m,i)=>[xs(i),ymap(m.rate)]);
  svg+=`<polyline points="${pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ")}" style="fill:none;stroke:var(--ok);stroke-width:2.5"/>`;
  M.forEach((m,i)=>{
    const [x,y]=pts[i];
    svg+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.5" style="fill:var(--bg);stroke:var(--ok);stroke-width:2"/>`;

function _chartMix(M){

function _chartFans(AM){
  const n=AM.length; if(n<2) return `<div class="panel" style="text-align:center;color:var(--soft)">数据不足</div>`;
  const W=840,H=280,L=58,R=18,T=34,B=46;

    case "adopt-open": adoptModal(id); break;
    case "adopt-confirm": adoptConfirm(id); break;
    case "wk-wait":{ const f=findItem(id); if(f){f.it.status="观望";save();render();toast("👀 已标记观望，留在选题池（跨期可捞回）");} break; }
    case "wk-ignore":{ const f=findItem(id); if(f){f.it.status="忽略";save();render();toast("已忽略");} break; }
    case "gen-report": online ? runGenerate() : genWeekly(); break;
    case "dchart": dChart=t.dataset.m; render(); break;
    case "new-card": newCardModal(); break;
    case "create-confirm": createConfirm(); break;
    case "cal-prev": calOffset--; render(); break;
    case "cal-next": calOffset++; render(); break;
    case "cal-today": calOffset=0; render(); break;
    case "pend-jump": jumpPend(id); break;
    case "col-acct": colAcct=id; render(); break;
    case "add-col":{ S.columns[colAcct].push({id:uid(),name:"新栏目",pos:"",keywords:[],pref:""});
      save(); render(); toast("＋ 已新增栏目，填写后记得保存"); break; }
    case "del-col":{ S.columns[colAcct]=S.columns[colAcct].filter(c=>c.id!==id); save(); render(); toast("栏目已删除"); break; }
    case "save-cols": save(); toast("💾 栏目配置已保存，将驱动下次周报生成"); break;
    case "report-open": reportModal(); break;
    case "generate-report": generateReport(); break;
    case "copy-report-link":{ const v=document.getElementById("rep-url").value; copyText(v); break; }
    case "preview-report": closeModal(); location.hash="report="+id; route(); break;
    case "exit-report": clearHash(); route(); break;
    case "user-edit": userModal(); break;
    case "user-save":{ const v=document.getElementById("user-name").value.trim();
      if(v){S.user=v;save();closeModal();render();toast("👤 登录人已更新，后续日志将记录为新名称");} break; }
    case "reset-ask": resetModal(); break;
    case "reset-confirm": doReset(); break;
    case "config-open": configModal(); break;
    case "export-demo": { const a=document.createElement("a"); a.href="/api/export-demo"; a.download="";
      document.body.appendChild(a); a.click(); a.remove();
      toast("⬇ 离线演示版已生成，开始下载（单文件，发给谁都能双击打开）"); break; }
    case "config-save": (async()=>{ const k=document.getElementById("cfg-key").value.trim();
      if(!k){toast("请输入 DeepSeek API Key",true);return;}
      try{ await api("/config/key",{method:"POST",body:JSON.stringify({key:k})});
        toast("🔑 Key 已保存，生成模式切换为「真实碰撞」"); configModal(); }
      catch(e){ toast("保存失败："+e.message,true); } })(); break;
    case "bench-save":{ const v=parseFloat(document.getElementById("bench-rate").value);
      if(!(v>0&&v<=100)){toast("请输入 0-100 之间的互动率百分数",true);break;}
      S.bench={rate:Math.round(v*10)/10,label:document.getElementById("bench-label").value.trim()||"行业基准"};
      save(); closeModal(); render(); toast(`📐 行业基准已更新：${S.bench.label} ${S.bench.rate}%`); break; }
    case "config-clear": (async()=>{ try{ await api("/config/key",{method:"POST",body:JSON.stringify({clear:true})});
        toast("已清除 Key，回到链路验证模式"); configModal(); }
      catch(e){ toast("操作失败："+e.message,true); } })(); break;
    case "close-modal": closeModal(); break;
  }
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.id==="rep-brand"){ repBrand=el.value;
    document.getElementById("rep-list").innerHTML=repListHTML(repBrand); return; }
  if(el.id==="nc-acct"){ const cols=S.columns[el.value]||[];
    document.getElementById("nc-col").innerHTML=cols.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join(""); return; }
  if(el.dataset.af==="status"){ archFilter.status=el.value==="全部"?"全部":el.value; render(); return; }
  if(el.dataset.af==="col"){ archFilter.col=el.value; render(); return; }
  if(el.dataset.afq!==undefined){ archFilter.q=el.value.trim(); render(); return; }
  const cf=el.dataset.cf;
  if(cf){ const c=getCard(drawerId); if(!c)return;
    if(cf==="owner"){ c.owner=el.value; }
    else if(cf==="schedTbd"){
      if(el.checked){ c.scheduleDate="待定"; if(!c.pendNote)c.pendNote=c.adoptNote||"档期待确认"; }
      else { c.scheduleDate=null; c.pendNote=""; }
    }
    else if(cf==="schedDate"&&c.scheduleDate!=="待定"){ c.scheduleDate=el.value||null; }
    save(); render(); renderDrawer(); return; }
  const bf=el.dataset.bf;
  if(bf){ const b=el.dataset.brand; if(!S.brandCards[b])S.brandCards[b]={audience:"",tone:"",taboos:[]};
    if(bf==="taboos"){ S.brandCards[b].taboos=el.value.split(/[；;]/).map(s=>s.trim()).filter(Boolean); }
    else S.brandCards[b][bf]=el.value;
    save(); return; }
  const colf=el.dataset.colf;
  if(colf){ const col=(S.columns[colAcct]||[]).find(x=>x.id===el.dataset.colid); if(!col)return;
    if(colf==="keywords"){ col.keywords=el.value.split(/[，,]/).map(s=>s.trim()).filter(Boolean); }
    else if(colf==="taboosJoin"){ col.taboos=el.value.split(/[；;]/).map(s=>s.trim()).filter(Boolean); }
    else col[colf]=el.value;
    save(); return; }
});
document.addEventListener("input",e=>{
  if(e.target.id==="search"){ searchQ=e.target.value.trim().toLowerCase(); render(); }
});
window.addEventListener("hashchange",route);

/* ---------- 悬停导航抽屉（桌面）+ 底部 Tab（移动）---------- */
const isMobile=()=>matchMedia("(max-width:640px)").matches;
(function(){
  const edge=document.getElementById("edgezone"), dn=document.getElementById("drawer-nav");
  if(!edge||!dn) return;
  let navT=null;
  const open=()=>{clearTimeout(navT);
    if(!document.body.classList.contains("nav-pin")) document.body.classList.add("nav-open");};
  const sched=()=>{clearTimeout(navT);
    navT=setTimeout(()=>{if(!document.body.classList.contains("nav-pin"))document.body.classList.remove("nav-open")},280);};
  edge.addEventListener("mouseenter",open);
  edge.addEventListener("mouseleave",sched);
  dn.addEventListener("mouseenter",open);
  dn.addEventListener("mouseleave",sched);
  try{ if(localStorage.getItem("xg_navpin")==="1"){ document.body.classList.add("nav-pin");
    const pb=document.getElementById("pin-btn"); if(pb) pb.textContent="✓ 已固定常驻"; } }catch(e){}
})();

/* ---------- 星空粒子 / 时钟 ---------- */
const cv=document.getElementById("stars"),cx=cv.getContext("2d");
const CY=tok("--cy");
let W,H,ps=[];
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;
  ps=Array.from({length:60},()=>({x:Math.random()*W,y:Math.random()*H,v:.12+Math.random()*.3,r:.6+Math.random()*1.3,o:.12+Math.random()*.35}))}
rs();addEventListener("resize",rs);
(function loop(){cx.clearRect(0,0,W,H);
  ps.forEach(p=>{p.y-=p.v;if(p.y<-4){p.y=H+4;p.x=Math.random()*W}
    cx.globalAlpha=p.o;cx.fillStyle=CY;cx.beginPath();cx.arc(p.x,p.y,p.r,0,7);cx.fill()});
  cx.globalAlpha=1;requestAnimationFrame(loop)})();
function clockTick(){const d=new Date();
  const el=document.getElementById("clock");
  if(el)el.textContent=d.toLocaleDateString("zh-CN")+" "+d.toLocaleTimeString("zh-CN",{hour12:false})}
clockTick();setInterval(clockTick,1000);

/* ---------- 初始化 ---------- */
bootState();
